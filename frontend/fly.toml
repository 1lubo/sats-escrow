app = "sats-escrow-frontend"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    VITE_API_URL = "https://sats-escrow.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1