[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/api",
    "crates/adapters",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SatsEscrow Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
mongodb = "2"

# Error handling
thiserror = "1"
anyhow = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
tokio-test = "0.4"

# Internal crates
sats-escrow-core = { path = "crates/core" }
sats-escrow-api = { path = "crates/api" }
sats-escrow-adapters = { path = "crates/adapters" }
